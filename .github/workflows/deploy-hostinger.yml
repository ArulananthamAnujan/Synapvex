name: Build & publish to Hostinger branch

# On every push to main, build the Vite site and publish the built output
# (the dist/ folder) to a dedicated `hostinger` branch. Hostinger's Git
# deployment then pulls that branch into public_html — so what Hostinger
# serves is the already-built site, not the source.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # These come from GitHub repo secrets (Settings → Secrets → Actions).
          # The anon key is safe to expose — it already ships in the browser bundle.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publish built site to the hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger
          force_orphan: true
          cname: false
